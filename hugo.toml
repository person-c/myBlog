baseURL = "https://cying.org/"
languageCode = "en-us"
title = "Nightingale"

ignoreFiles = ["\\.Rmd$"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    footnote = true
  [markup.highlight]
    noClasses = false
    style = "monokai"
    lineNumbers = true
    lineNumbersInTable = true
    guessSyntax = true

[server]
  watch = true

enableGitInfo = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "A personal blog about bioinformatics, R programming, statistics, and programming notes."

[module]
  [[module.imports]]
    path = "github.com/person-c/Nothing"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[menu.main]]
    name = "Note"
    url = "/note/"
    weight = 4
  [[menu.main]]
    name = "Slides"
    url = "/slides/"
    weight = 5
  [[menu.main]]
    name = "Books"
    url = "/books/"
    weight = 6
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 7

paginate = 10
