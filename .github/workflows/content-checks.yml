name: content checks

# The two deterministic checks that were previously only run by hand, and only
# when someone remembered to.  Both are hard gates -- unlike annotation-guard,
# which deliberately never blocks.
#
#   * scripts/check-math.R -- formulas litedown will not protect, and which
#     therefore never typeset in the browser (KaTeX auto-render has no single-$
#     rule).  It catches broken *rendering*, not style.
#   * scripts/check-meta.R -- YAML front matter: title, date, draft, tags.
#
# Both are run from the repository root, which is what they expect: the argument
# is `content`, resolved relative to the working directory.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Only what the two scripts themselves require: xfun reads the files,
      # yaml parses the front matter, jsonlite is used by ad-hoc probes.
      # setup-r@v2 does not install packages (that is setup-r-dependencies).
      - name: Install dependencies
        run: |
          install.packages(c("xfun", "yaml", "jsonlite"))
          for (p in c("xfun", "yaml", "jsonlite")) {
            if (!requireNamespace(p, quietly = TRUE)) stop("missing: ", p)
          }
        shell: Rscript {0}

      - name: Math that will not render (check-math.R)
        run: Rscript scripts/check-math.R content

      # Runs even when check-math failed, so one push reports every problem
      # rather than only the first.
      - name: Front matter (check-meta.R)
        if: always()
        run: Rscript scripts/check-meta.R content
